name: Publish verified 2025 energy demo snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish_energy_snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: annual-energy-snapshot-main
  cancel-in-progress: false

jobs:
  extract-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the tested data pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test the ETL and public export
        run: |
          ruff check .
          pytest -q
      - name: Download and validate the complete 2025 REData history
        run: |
          python scripts/run_pipeline.py --start 2025-01-01 --end 2025-12-31 --refresh-raw
      - name: Build the verified compact public snapshot
        run: python scripts/build_public_demo.py
      - name: Commit and publish the derived CSV snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/indicators.csv app/data/observations.csv app/data/source.json
          if git diff --cached --quiet; then
            echo "Data snapshot unchanged."
          else
            git commit -m "data: publish validated historical 2025 REData companion snapshot"
            git push origin HEAD:main
          fi
